[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar"
version = "0.0.1"
description = "Weekly AI GitHub trend radar: composite index of stars, forks, contributions, packages, mentions"
requires-python = ">=3.12,<3.14"   # CI 3.12, 로컬 3.13 (SPEC N1)
dependencies = []

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: 실제 외부 호출 (기본 실행에서 제외)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
