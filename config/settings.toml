# github-ai-trend-radar 설정 (SPEC D1·D2, PLAN §1)

[startrend]
# star-trend 저장소 루트. 환경변수 RADAR_STARTREND_DIR 가 있으면 그것을 쓴다(CI 는 얕은 클론 경로)
dir = "../../github-ai-star-trend"

[candidates]
cap = 200          # D2 — 그 주 AI 저장소 스타 증가 상위
previous_top = 10  # 지난주 종합 TOP 10 가운데 빠진 저장소를 더한다

[weights]
# D1 가중치 v1 — 사용·기여 쪽에 더. 바꾸면 version 을 올린다(SPEC §4-1)
version = 1
s1 = 15  # 스타
s2 = 15  # 포크
s3 = 25  # 기여
s4 = 30  # 사용
s5 = 15  # 언급

[angles]
# F9 관점 유형 임계값 v1 (SPEC 초기값). M2 소급 실측으로 한 번 조정한 뒤 고정, 바꾸면 version 을 올린다
version = 1
a_star_max = 50.0      # A 조용한 강자: 스타 백분위 <
a_use_min = 80.0       #   사용·기여 평균 ≥
b_attention_min = 90.0 # B 반짝 관심: 스타 또는 언급 ≥
b_use_max = 30.0       #   포크·기여·사용 평균 ≤
c_rises = 4            # C 꾸준한 상승: 연속 상승 주
lookback = 4           # D 신호 전환: 몇 주 전과 비교
d_shift_min = 20.0     #   사용·기여 비중 상승 %p ≥
cap = 5                # 유형마다 최대

[insights]
# F10-1 코드 관찰 I1~I7 규칙 v1 (SPEC). 문구·임계값을 바꾸면 version 을 올린다
version = 1
window_weeks = 12   # 이번 주 포함 최근 몇 주를 보나
ratio_top = 0.2     # I1·I3 후보 안 상위·하위 이 비율이면 뜻을 붙인다
jump_min = 0.3      # I2 한 주 다운로드 증가가 이 이상이면 문장으로
single_share = 0.8  # I5 글 하나가 언급 점수의 이 비율 이상
quiet_points = 10   # I5 창 전체 언급 점수 합이 이 미만이면 "조용하다"
